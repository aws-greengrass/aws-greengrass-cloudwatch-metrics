name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: '*'

# Read-only token; commitlint lists the PR's commits, so it also needs pull-requests: read.
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest mock
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          python -m pytest

  # The job above uses setup-python, which is not externally managed; this one runs installer.py on each distro's own Python.
  installer-on-os-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['debian:trixie', 'debian:bookworm', 'ubuntu:24.04', 'ubuntu:22.04', 'ubuntu:20.04']
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install OS Python
        run: apt-get update && apt-get install -y python3 python3-pip sudo
      - name: Run installer as Greengrass does (non-root component user, non-login sh)
        run: |
          useradd -m ggc_user
          sudo -n -E -H -u ggc_user -- sh -c "cd ~ && python3 -u $GITHUB_WORKSPACE/installer.py"
          sudo -n -E -H -u ggc_user -- sh -c "python3 -c 'import boto3, awsiot'"